services:
  app:
    build:
      context: .
      dockerfile: dockerfile.dev
    container_name: express-practice-app

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env.docker

    depends_on:
      - db

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev

  db:
    image: mariadb:11
    container_name: express-practice-db

    restart: always

    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: express-practice
      MARIADB_USER: root
      MARIADB_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
